<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Access Blocked</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          #202020 0%,
          #101010 35%,
          #050505 75%,
          #000000 100%
        );

      color: #f5f5f5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      padding: 28px;
    }

    .blocked {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .icon {
      width: 92px;
      height: 92px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 28px;

      border: 3px solid #d64545;
      border-radius: 50%;

      color: #d64545;
      font-size: 48px;
      font-weight: 700;
    }

    h1 {
      margin: 0;

      font-size: clamp(38px, 8vw, 68px);
      line-height: 1.05;
      letter-spacing: -2px;

      color: #ffffff;
    }

    .reason {
      color: #e05252;
    }

    .message {
      margin: 28px auto 0;
      max-width: 520px;

      color: #999999;

      font-size: 17px;
      line-height: 1.7;
    }

    .divider {
      width: 60px;
      height: 1px;

      margin: 34px auto;

      background: #333333;
    }

    .code {
      color: #555555;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 12px;
      letter-spacing: 1px;
    }

    .incident {
      margin-top: 10px;

      color: #333333;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 10px;
    }

    @media (max-width: 500px) {
      body {
        padding: 22px;
      }

      .icon {
        width: 76px;
        height: 76px;

        font-size: 40px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="blocked">

    <div class="icon">
      !
    </div>

    <h1>
      You have been blocked
      <br>
      <span class="reason">due to rasande.</span>
    </h1>

    <div class="message">
      Access to Coffee Tracker has been suspended.
      <br>
      Please contact your administrator.
    </div>

    <div class="divider"></div>

    <div class="code">
      ERROR 403 · RASANDE_DETECTED
    </div>

    <div class="incident">
      COFFEE TRACKER ACCESS CONTROL
    </div>

  </main>

</body>
</html>
